# Serves the built app and forwards /api to the backend container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # replace (not append) the client address, so visitors cannot fake it to dodge the rate limit
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /actuator/ {
    return 404;
  }

  # hashed build files never change: cache them for a year
  location /assets/ {
    # nginx's type list has no .mjs; MapLibre's worker is one, and with nosniff the browser
    # refuses to run it unless it is served as JavaScript
    location ~ \.mjs$ {
      default_type application/javascript;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri /index.html;
  }
}
