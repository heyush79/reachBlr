# Run everything locally with one command:  docker compose up --build
# Then open http://localhost:8080
# Port 8080 taken? Pick another:  APP_PORT=8090 docker compose up --build   (or put APP_PORT=8090 in .env)
# Optional: put GOOGLE_PLACES_API_KEY (and the rate limits) in .env to turn on "Nearby on Google".
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
